version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      - DATABASE_URL=file:./dev.db
      - FAST2SMS_API_KEY=${FAST2SMS_API_KEY:-}
      - PORT=5001
    volumes:
      - app-db:/app/backend/prisma

volumes:
  app-db:
